<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Твоя Галера · асистент</title>
  </head>
  <body>
    <div id="chat" style="white-space: pre-wrap"></div>

    <form id="form">
      <label>
        <input
          type="text"
          id="question"
          placeholder="You question"
          size="50"
          autocomplete="off"
        />
      </label>
      <button id="send">Send</button>
    </form>

    <script type="module" src="chat.js"></script>
  </body>
</html>
