<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Твоя Галера · асистент</title>
</head>
<body>
    <div id="chat" style="white-space: pre-wrap"></div>

    <form id="form">
        <label>
            <input type="text" id="question" placeholder="You question" size="50" autocomplete="off" />
        </label>
        <button>Send</button>
    </form>

    <script type="module">
      const chat = document.querySelector('#chat')
      const input = document.querySelector('#question');
      const history = [];

      function addMessage(text = '') {
        const p = document.createElement('p');
        p.textContent = text;
        return chat.appendChild(p);
      }

      document.getElementById('form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = input.value.trim();
        if (!question) return;
        input.value = '';

        addMessage('You: ' + question);
        const answerE1 = addMessage();
        const sourceE1 = addMessage();

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, history }),
        })

        // Events are separated by an empty line; an incomplete event is left in the buffer until the next batch
        const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = '';
        for (let chunk = await reader.read(); !chunk.done; chunk = await reader.read()) {
          const events = (buffer + chunk.value).split('\n\n');
          buffer = events.pop();
          for (const raw of events) {
            const [, type, data] = raw.match(/^event: (.+)\ndata: (.+)$/);
            const value = JSON.parse(data);
            if (type === 'token') answerE1.textContent += value;
            if (type === 'source') sourceE1.textContent = "Source: " + value.map(s => `[${s.n} ${s.title}]`).join(", ");
            if (type === 'error') answerE1.textContent = value;
          }
        }
        history.push(
          { role: 'user', content: 'question' },
          { role: 'assistant', content: answerE1.textContent },
        );
      })
    </script>
</body>
</html>
